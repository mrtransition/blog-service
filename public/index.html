                return idx === -1 ? '' : path.slice(0, idx);
            }

            function showFileTooltip(row) {
                if (!fileTooltip) return;
                const name = row.dataset.fullName || '';
                const fullPath = row.dataset.fullPath || '';
                if (!name) return;

                fileTooltip.innerHTML = '';
                const nameEl = document.createElement('div');
                nameEl.className = 'tt-name';
                nameEl.textContent = name;
                fileTooltip.appendChild(nameEl);

                // 绝对路径：能拿到博客根目录时拼出完整磁盘路径，否则退回到相对目录
                const dir = directoryOf(fullPath);
                const root = window._blogRoot || '';
                const absPath = root
                    ? root.replace(/[\\/]+$/, '') + '\\' + (dir ? dir.replace(/\//g, '\\') : '')
                    : dir;
                if (absPath) {
                    const pathEl = document.createElement('div');
                    pathEl.className = 'tt-path';
                    pathEl.textContent = absPath;
                    fileTooltip.appendChild(pathEl);
                }

                fileTooltip.classList.add('show');
                fileTooltip.setAttribute('aria-hidden', 'false');
                positionFileTooltip(row);
            }

            // 定位到行的右侧；空间不足时改为上方对齐，避免超出视口。
            function positionFileTooltip(row) {
                if (!fileTooltip || !fileTooltip.classList.contains('show')) return;
                const rect = row.getBoundingClientRect();
                const tipRect = fileTooltip.getBoundingClientRect();
                const margin = 8;

                let left = rect.right + margin;
                if (left + tipRect.width > window.innerWidth - margin) {
                    left = Math.max(margin, window.innerWidth - margin - tipRect.width);
                }
                let top = rect.top + (rect.height - tipRect.height) / 2;
                if (top < margin) {
                    top = margin;
                } else if (top + tipRect.height > window.innerHeight - margin) {
                    top = Math.max(margin, window.innerHeight - margin - tipRect.height);
                }
                fileTooltip.style.left = Math.round(left) + 'px';
                fileTooltip.style.top = Math.round(top) + 'px';
            }

            function hideFileTooltip() {
                if (tooltipTimer) { clearTimeout(tooltipTimer); tooltipTimer = null; }
                if (!fileTooltip) return;
                fileTooltip.classList.remove('show');
                fileTooltip.setAttribute('aria-hidden', 'true');
            }

            function initFileTooltip() {
                if (!fileTooltip) return;

                treeContainer.addEventListener('mouseover', (e) => {
                    const row = e.target.closest('.node-row');
                    if (!row || !treeContainer.contains(row)) return;
                    if (e.relatedTarget && row.contains(e.relatedTarget)) return;
                    if (tooltipTimer) clearTimeout(tooltipTimer);
                    // 轻微延迟，避免快速划过时反复闪烁
                    tooltipTimer = setTimeout(() => showFileTooltip(row), 180);
                });

                treeContainer.addEventListener('mouseout', (e) => {
                    const row = e.target.closest('.node-row');
                    if (!row) return;
                    if (e.relatedTarget && row.contains(e.relatedTarget)) return;
                    hideFileTooltip();
                });

                // 键盘用户：聚焦时同样给出完整名称
                treeContainer.addEventListener('focusin', (e) => {
                    const row = e.target.closest('.node-row');
                    if (row) showFileTooltip(row);
                });
                treeContainer.addEventListener('focusout', hideFileTooltip);

                // 滚动或窗口尺寸变化后位置会失效，直接收起
                treeContainer.addEventListener('scroll', hideFileTooltip, { passive: true });
                window.addEventListener('resize', hideFileTooltip);
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'Escape') hideFileTooltip();
                });
            }

            // ========= 在文件夹中定位文件 =========
            async function revealFile(filePath) {
                if (!filePath) return;
                try {
                    const res = await fetch(API_REVEAL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ path: filePath })
                    });
                    if (!res.ok) {
                        // 后端会带上 detail（如"服务运行于 Session 0"），透传以便定位原因
                        let message = `定位失败 (${res.status})`;
                        try {
                            const data = await res.json();
                            if (data && data.error) {
                                message = data.detail ? `${data.error}：${data.detail}` : data.error;
                            }
                        } catch (e) { /* 响应不是 JSON，保留默认文案 */ }
                        throw new Error(message);
                    }
                } catch (err) {
                    // fetch 本身失败（服务未启动、跨域等）时 err.message 为 "Failed to fetch"
                    const msg = err && err.message && err.message !== 'Failed to fetch'
                        ? err.message
                        : '无法连接到博客服务，请确认程序正在运行';
                    toast(msg, 5200);
                }
            }

            // 轻量提示条，避免用 alert 阻断阅读
            let toastTimer = null;
            function toast(message, duration) {
                let el = document.getElementById('appToast');
                if (!el) {
                    el = document.createElement('div');
                    el.id = 'appToast';
                    el.className = 'app-toast';
                    el.setAttribute('role', 'status');
                    document.body.appendChild(el);
                }
                el.textContent = message;
                el.classList.add('show');
                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), duration || 2600);
            }

            function buildTreeDOM(nodes, container, level = 0) {
                container.innerHTML = '';
                if (!nodes || nodes.length === 0) {
                    container.innerHTML = '<div class="empty-tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>暂无文章</div>';
                    return;
                }
                for (const node of nodes) {
                    const nodeDiv = document.createElement('div');
                    nodeDiv.className = 'tree-node collapsed';
                    nodeDiv.dataset.name = node.name.toLowerCase();
                    nodeDiv.dataset.type = node.type;
                    nodeDiv.dataset.path = node.path || '';

                    const row = document.createElement('div');
                    row.className = 'node-row';
                    row.dataset.path = node.path || '';

                    if (node.type === 'directory') {
                        row.innerHTML = `<span class="arrow">▼</span><span class="node-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg></span><span class="node-name">${escapeHtml(node.name)}</span>`;
                        row.dataset.fullName = node.name;
                        row.dataset.fullPath = node.path || '';
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            const isCollapsed = nodeDiv.classList.contains('collapsed');
                            nodeDiv.classList.toggle('collapsed', !isCollapsed);
                            nodeDiv.classList.toggle('expanded', isCollapsed);
                            updateTreeHeight(nodeDiv);
                        });
                    } else {
                        const displayName = node.name.replace(/\.(md|html)$/i, '');
                        const isHtmlFile = node.name.toLowerCase().endsWith('.html');
                        const fileIcon = isHtmlFile
                            ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
                            : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>';
                        row.innerHTML = `<span class="arrow" style="visibility:hidden;">▼</span><span class="node-icon">${fileIcon}</span><span class="node-name">${escapeHtml(displayName)}</span><button type="button" class="node-reveal" title="在文件夹中定位" aria-label="在文件夹中定位 ${escapeHtml(node.name)}"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="2.5"/></svg></button>`;
                        // 悬浮提示显示被省略号截断的完整文件名与目录
                        row.dataset.fullName = node.name;
                        row.dataset.fullPath = node.path || '';
                        row.querySelector('.node-reveal').addEventListener('click', (e) => {
                            e.stopPropagation();
                            revealFile(node.path);
                        });
                        row.addEventListener('click', (e) => {
                            e.stopPropagation();
                            loadArticle(node.path, node.dirPath || '');
                        });
                    }

                    nodeDiv.appendChild(row);
                    if (node.children && node.children.length > 0) {
                        const childrenDiv = document.createElement('div');
                        childrenDiv.className = 'children';
                        buildTreeDOM(node.children, childrenDiv, level + 1);
                        nodeDiv.appendChild(childrenDiv);
                        if (level === 0) {
                            nodeDiv.classList.remove('collapsed');
                            nodeDiv.classList.add('expanded');
                        }
                    }
                    container.appendChild(nodeDiv);
                }
                container.querySelectorAll('.tree-node.expanded').forEach(node => updateChildrenHeight(node));
            }

            function updateChildrenHeight(node) {
                const childrenDiv = node.querySelector(':scope > .children');
                if (!childrenDiv) return;
                if (node.classList.contains('collapsed')) {
                    childrenDiv.style.maxHeight = '0px';
                } else {
                    const descendants = childrenDiv.querySelectorAll('.children');
                    descendants.forEach(n => n.style.maxHeight = 'none');
                    const h = childrenDiv.scrollHeight;
                    descendants.forEach(n => n.style.maxHeight = '');
                    childrenDiv.style.maxHeight = h + 'px';
                }
            }
            function updateTreeHeight(node) {
                updateChildrenHeight(node);
                let parent = node.parentElement;
                while (parent) {
                    if (parent.classList.contains('tree-node')) {
                        updateChildrenHeight(parent);
                    }
                    parent = parent.parentElement;
                }
            }

            function filterTree(searchTerm) {
                const term = searchTerm.toLowerCase().trim();
                const allNodes = treeContainer.querySelectorAll('.tree-node');
                allNodes.forEach(node => node.classList.remove('hidden-by-search','match-highlight','match-in-children'));
                searchEmpty.classList.remove('show');
                if (!term) {
                    allNodes.forEach(node => {
                        const level = getNodeLevel(node);
                        if (level === 0 && node.dataset.type === 'directory') {
                            node.classList.remove('collapsed'); node.classList.add('expanded');
                        } else if (level > 0) {
                            node.classList.add('collapsed'); node.classList.remove('expanded');
                        }
                    });
                    allNodes.forEach(node => { if (node.classList.contains('expanded')) updateChildrenHeight(node); });
                    return;
                }
                const matchedNodes = new Set();
                allNodes.forEach(node => { if (node.dataset.name.includes(term)) matchedNodes.add(node); });
                allNodes.forEach(node => {
                    if (hasMatchedDescendant(node, matchedNodes)) {
                        node.classList.add('match-in-children');
                        node.classList.remove('collapsed'); node.classList.add('expanded');
                    }
                });
                allNodes.forEach(node => {
                    let parent = node.parentElement;
                    if (matchedNodes.has(node) || node.classList.contains('match-in-children')) {
                        while (parent) {
                            if (parent.classList.contains('tree-node')) {
                                parent.classList.remove('collapsed'); parent.classList.add('expanded');
                            }
                            parent = parent.parentElement;
                        }
                    }
                });
                let visibleCount = 0;
                allNodes.forEach(node => {
                    const isMatch = matchedNodes.has(node);
                    const hasMatch = node.classList.contains('match-in-children');
                    if (!isMatch && !hasMatch && node.dataset.type === 'file') node.classList.add('hidden-by-search');
                    if (!isMatch && !hasMatch && node.dataset.type === 'directory' && !hasVisibleChildren(node)) node.classList.add('hidden-by-search');
                    if (!node.classList.contains('hidden-by-search')) visibleCount++;
                });
                allNodes.forEach(node => { if (node.classList.contains('expanded')) updateChildrenHeight(node); });
                if (visibleCount === 0) searchEmpty.classList.add('show');
            }

            function hasMatchedDescendant(node, matchedNodes) {
                const children = node.querySelectorAll(':scope > .children > .tree-node');
                for (const child of children) {
                    if (matchedNodes.has(child)) return true;
                    if (hasMatchedDescendant(child, matchedNodes)) return true;
                }
                return false;
            }
            function hasVisibleChildren(node) {
                const children = node.querySelectorAll(':scope > .children > .tree-node');
                for (const child of children) {
                    if (!child.classList.contains('hidden-by-search')) return true;
                    if (hasVisibleChildren(child)) return true;
                }
                return false;
            }
            function getNodeLevel(node) {
                let level = 0, parent = node.parentElement;
                while (parent) { if (parent.classList.contains('tree-node')) level++; parent = parent.parentElement; }
                return level;
            }

            searchInput.addEventListener('input', () => {
                clearTimeout(window._searchTimeout);
                window._searchTimeout = setTimeout(() => filterTree(searchInput.value), 200);
            });

            async function loadTree() {
                try {
                    treeContainer.innerHTML = '<div class="empty-tree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>加载中…</div>';
                    const res = await fetch(API_TREE);
                    if (!res.ok) throw new Error(`请求失败 (${res.status})`);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    treeData = data.children || [];
                    articleCount = countArticles(treeData);
                    sidebarMeta.textContent = `共 ${articleCount} 篇`;
                    buildTreeDOM(treeData, treeContainer);

                    const hashPath = getFilePathFromHash();
                    if (hashPath) {
                        // 草稿不在导航树中，但仍允许通过直接 URL 预览
                        const found = findNodeByPath(treeData, hashPath);
                        loadArticle(hashPath, found ? (found.dirPath || '') : '');
                        return;
                    }
                    if (!currentFilePath) loadWelcome();
                } catch (err) {
                    treeContainer.innerHTML = `<div class="empty-tree">⚠️ 加载失败<br><small>${escapeHtml(err.message)}</small></div>`;
                    sidebarMeta.textContent = '错误';
                    loadWelcome();
                }
            }

            function findNodeByPath(nodes, targetPath) {
                for (const node of nodes) {
                    if (node.type === 'file' && node.path === targetPath) return node;
                    if (node.children) {
                        const found = findNodeByPath(node.children, targetPath);
                        if (found) return found;
                    }
                }
                return null;
            }

            window.addEventListener('hashchange', () => {
                const hashPath = getFilePathFromHash();
                if (hashPath && hashPath !== currentFilePath && treeData) {
                    // 草稿不在导航树中，仍按路径直接加载
                    const found = findNodeByPath(treeData, hashPath);
                    loadArticle(hashPath, found ? (found.dirPath || '') : '');
                } else if (!hashPath && currentFilePath) {
                    loadWelcome();
                }
            });
            document.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') { e.preventDefault(); searchInput.focus(); }
                if (e.key === 'Escape') {
                    if (widthPopover && !widthPopover.hidden) closeWidthPopover();
                    if (isFullscreenMode()) leaveFullscreen();
                    searchInput.value = ''; filterTree(''); searchInput.blur();
                }
            });

            async function initApp() {
                // 与首屏脚本保持一致，恢复左侧目录栏的收起状态
                setSidebarCollapsed(readStored(SIDEBAR_STATE_KEY) === '1', false);
                applyContentWidth(readStored(WIDTH_STATE_KEY), false);
                updateFullscreenUI();
                initFileTooltip();
                await loadBlogConfig();
                loadTree();
                updateBreadcrumb([]);
            }

            // defer 脚本在 DOMContentLoaded 前按顺序执行，等渲染库就绪后再初始化
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', initApp);
            } else {
                initApp();
            }

        })();
    </script>
</body>
